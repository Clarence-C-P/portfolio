<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Log in · REN_DC.DEV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
  <!-- type="module" lets the file use import/export -->
  <script type="module" src="js/login.js"></script>
</head>
<body class="auth-page">
  <main class="auth-panel">
    <a class="auth-home" href="./">REN_DC.DEV</a>
    <h1>Log in</h1>
    <p class="meta">Editor access for the site owner.</p>

    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <!-- role="alert" makes screen readers announce the message -->
      <p id="login-error" class="form-error" role="alert" hidden></p>

      <button id="login-button" class="btn" type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
